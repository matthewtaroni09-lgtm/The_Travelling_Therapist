<html lang="en">
{% load static %}

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- Custom css -->
    <link rel="stylesheet" href="{% static 'auction/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>The Traveling Therapist</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/dla5ohp.css">

    <link rel="shortcut icon" type="image/png" href="{% static 'auction/favicon.ico' %}" />

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GPRVT4HYZD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-GPRVT4HYZD');
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.8.2"
        integrity="sha384-+8ISc/waZcRdXCLxVgbsLzay31nCdyZXQxnsUy++HJzJliTzxKWr0m1cIEMyUzQu"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Navigation -->
    {% include 'auction/navigation.html' %}

    <!-- Runs the auction countdown clock -->
    <script src="{% static 'auction/auction.js' %}"></script>
    <!-- Main Content -->
    {% if request.path == '/' %}
    <div class="container my-3 py-3 p-md-3">
        <h3 id="tag-line" class="text-center font-italic">
            Connecting Therapists and Clinics to Fill Temporary Positions
        </h3>
    </div>
    {%endif%}
    <main class="container my-3 py-3 p-md-5 bg-light">
        <!-- Generic Pop-up -->
        <div class="modal fade" id="popupModal" tabindex="1" aria-labelledby="popupModal" aria-hidden="false">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="modalParagraph"></p>
                        <form method="post">
                            {% csrf_token %}
                            <div id="modalSubFooterButtonDiv">
                                <button id="modalPopupOKButton" type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">OK</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'auction/footer.html' %}
</body>


</html>
