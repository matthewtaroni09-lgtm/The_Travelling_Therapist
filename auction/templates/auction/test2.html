{% extends 'auction/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="mx-auto my-4 text-center">
    <h1>Contact Us</h1>
    <p>Use this contact form to send us any questions or feedback here.!!</p>
</div>
<div class="container">
    <form action="" method="post">
        {% csrf_token %}
        <div id="forms">
            {{ formset.as_p }}
        </div>
        <input type="submit" />
    </form>
</div>
{% endblock %}
