<div class="col-sm-6 col-lg-4 text-x-small">
  <a class="card mt-4 text-decoration-none text-dark" href="{% url 'auction' auction.auctionID %}">
    <div class="position-relative">
      {% if auction.clinic.imageOne %}
      <img src="/media/{{ auction.clinic.imageOne }}" class="card-img-top card-image" alt="Image of Clinic">
      {% else %}
      <img src="/media/images/no-image.jpg" class="card-img-top card-image" alt="Image of Clinic">
      {% endif %}
      <div
        class="d-inline-flex text-align-center text-white bg-dark p-2 rounded position-absolute bottom-0 start-0">
        <span class="material-icons small text-white">schedule</span>
        <p class="m-0 text-white align-self-center">Pending Approval</p>
      </div>
    </div>
    <div class="card-body">
      <h2 class="card-title">{{ auction.clinic.clinicName }}</h2>
      <p class="text-weight-thin mb-0">{{ auction.placementStart }} - {{ auction.placementEnd }}</p>
      <p class="text-weight-thin mb-0">{{ auction.clinic.userType }}</p>
      <p class="text-weight-thin">{{ auction.clinic.city }}, ON</p>
      <p class="card-text">{{ auction.clinic.about }}</p>
    </div>
  </a>
</div>
