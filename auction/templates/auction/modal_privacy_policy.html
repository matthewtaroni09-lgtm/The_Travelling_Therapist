<!-- Modal -->

        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="privacyModalLabel">Website Privacy Policy</h5>

            </div>
            <div id="termsAndConditions" class="modal-body">

            <div class="modal-footer">

            </div>
        </div>
    </div>
</div>
